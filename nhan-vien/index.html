<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhân viên</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/emp.css">
  <style>
    /* Khung thử nghiệm – KHÔNG thuộc module. Thanh đầu trang/điều hướng thật thuộc module khác. */
    html { color-scheme: light dark; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 22px; }
    .sh-top { height: 56px; display: flex; align-items: center; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-weight: 700; }
    .sh-dev { max-width: 1120px; margin: 16px auto 0; padding: 12px 16px; font-size: 13px; line-height: 18px; color: var(--text-muted); background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; }
    .sh-dev strong { color: var(--text); }
    .sh-dev .sh-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .sh-dev select, .sh-dev button { font: inherit; font-size: 13px; min-height: 36px; padding: 0 10px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
    .sh-wrap { margin: 0 12px; }
  </style>
</head>
<body>
  <div class="sh-top">Sổ Đề Nghị Chi</div>

  <div class="sh-wrap"><div class="sh-dev">
    <strong>Khung thử nghiệm</strong> (không thuộc module Nhân viên). Vai trò và các đề nghị chi thật thuộc các module khác.
    <div class="sh-row">
      <label for="sh-role">Giả lập vai trò:</label>
      <select id="sh-role">
        <option value="quan_ly">Quản lý</option>
        <option value="nhan_vien">Nhân viên (bị chặn)</option>
      </select>
      <button type="button" id="sh-seed">Nạp dữ liệu mẫu</button>
      <button type="button" id="sh-clear">Xóa dữ liệu thử</button>
    </div>
  </div></div>

  <div id="app"></div>

  <script src="js/emp-model.js"></script>
  <script src="js/emp-store.js"></script>
  <script src="js/emp-view.js"></script>
  <script>
    (function () {
      var store = DncEmpStore.create({ storage: window.localStorage });
      var app = document.getElementById('app');
      var roleSel = document.getElementById('sh-role');
      var ctrl = null;
      function mountPage() {
        if (ctrl) ctrl.destroy();
        ctrl = DncEmployees.mount(app, { store: store, session: roleSel.value === 'quan_ly' ? { vaiTro: 'quan_ly' } : { vaiTro: 'nhan_vien', nhanVienId: 'nv1' } });
      }
      /* Dữ liệu mẫu: 6 nhân viên (1 đã ngưng); một số đã có đề nghị nên không xóa được. */
      document.getElementById('sh-seed').addEventListener('click', function () {
        if (localStorage.getItem(DncEmpStore.KEY_NV) && !confirm('Đã có danh bạ nhân viên. Ghi đè bằng dữ liệu mẫu?')) return;
        var t = new Date().toISOString();
        localStorage.setItem(DncEmpStore.KEY_NV, JSON.stringify([
          { id: 'nv1', ma: 'NV001', hoTen: 'Nguyễn Văn An', hoatDong: true, ngayTao: t, ngayCapNhat: t },
          { id: 'nv2', ma: 'NV002', hoTen: 'Trần Thị Bình', hoatDong: true, ngayTao: t, ngayCapNhat: t },
          { id: 'nv3', ma: 'NV003', hoTen: 'Lê Hoàng Cường', hoatDong: true, ngayTao: t, ngayCapNhat: t },
          { id: 'nv4', ma: 'NV004', hoTen: 'Phạm Thu Dung', hoatDong: false, ngayTao: t, ngayCapNhat: t },
          { id: 'nv5', ma: 'NV005', hoTen: 'Đỗ Minh Khôi', hoatDong: true, ngayTao: t, ngayCapNhat: t },
          { id: 'nv6', ma: 'NV006', hoTen: 'Vũ Thị Lan', hoatDong: true, ngayTao: t, ngayCapNhat: t }
        ]));
        function mk(i, nv, st, sl, dg) { return { id: 'dn_seed' + i, nhanVienId: nv, nhaCungCap: 'Khoản mẫu ' + i, danhMuc: 'khac', soLuong: sl, donGia: dg, ngay: t.slice(0, 10), ghiChu: '', trangThai: st, lyDoTuChoi: null, ngayTao: t, ngayXuLy: st === 'cho_duyet' ? null : t }; }
        localStorage.setItem(DncEmpStore.KEY_DN, JSON.stringify([
          mk(1, 'nv1', 'da_duyet', 10, 45000), mk(2, 'nv1', 'da_duyet', 1, 4850000), mk(3, 'nv1', 'cho_duyet', 2, 120000),
          mk(4, 'nv2', 'da_duyet', 3, 650000), mk(5, 'nv2', 'tu_choi', 1, 900000), mk(6, 'nv3', 'cho_duyet', 6, 120000), mk(7, 'nv4', 'da_duyet', 4, 100000)
        ]));
        ctrl.refresh();
      });
      document.getElementById('sh-clear').addEventListener('click', function () {
        if (!confirm('Xóa toàn bộ dữ liệu thử (nhân viên và đề nghị)?')) return;
        localStorage.removeItem(DncEmpStore.KEY_NV); localStorage.removeItem(DncEmpStore.KEY_DN);
        ctrl.refresh();
      });
      roleSel.addEventListener('change', mountPage);
      mountPage();
    })();
  </script>
</body>
</html>
